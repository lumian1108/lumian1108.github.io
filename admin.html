<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>루미안 에스테틱 | 관리자 시스템</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgDark: '#163023',
                        boxDark: '#1F3C2C',
                        gold: '#d4af37',
                    }
                }
            }
        }

        // 파이어베이스 연동 키
        const firebaseConfig = {
            apiKey: "AIzaSyAL5Q-dAKzI8961lcUjMXM9UV1_IFywY2w",
            authDomain: "lumian-booking.firebaseapp.com",
            databaseURL: "https://lumian-booking-default-rtdb.firebaseio.com",
            projectId: "lumian-booking",
            storageBucket: "lumian-booking.firebasestorage.app",
            messagingSenderId: "326384208087",
            appId: "1:326384208087:web:24d696f92773c98251c892",
            measurementId: "G-ZKP4VRX43"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
    </script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { 
            font-family: 'Pretendard', sans-serif; 
            background-color: #163023; 
            color: white; 
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="antialiased flex justify-center min-h-screen">

    <div class="w-full max-w-md relative flex flex-col pt-12 pb-24 px-6">
        
        <!-- 로그인 섹션 -->
        <div id="loginSection" class="my-auto">
            <div class="text-center mb-8">
                <h1 class="text-gold text-3xl font-serif font-bold mb-2">LUMIAN ADMIN</h1>
                <p class="text-xs text-gray-300">루미안 에스테틱 관리자 대시보드</p>
            </div>

            <div class="bg-boxDark border border-gold/30 rounded-2xl p-6 shadow-xl space-y-4">
                <div>
                    <label class="block text-xs text-gray-300 mb-1">비밀번호</label>
                    <input type="password" id="adminPw" placeholder="비밀번호를 입력하세요 (기본: 1234)" class="w-full bg-[#163023] border border-gold/20 rounded-xl p-3.5 text-sm text-white focus:outline-none focus:border-gold">
                </div>
                <button onclick="checkLogin()" class="w-full bg-gold text-[#163023] font-bold rounded-xl py-3.5 shadow-lg active:scale-95 transition-transform">
                    관리자 로그인
                </button>
            </div>
        </div>

        <!-- 대시보드 섹션 -->
        <div id="dashboardSection" class="hidden">
            <div class="flex justify-between items-center mb-6 border-b border-gold/20 pb-4">
                <div>
                    <h2 class="text-xl font-bold text-gold">예약 현황 관리</h2>
                    <p class="text-xs text-gray-300 mt-1">실시간 승인/거절 대시보드</p>
                </div>
                <button onclick="logout()" class="text-xs text-gray-400 bg-boxDark border border-gold/20 px-3 py-1.5 rounded-lg">로그아웃</button>
            </div>

            <section class="bg-boxDark border border-gold/25 rounded-2xl p-4 mb-5">
                <h3 class="text-sm font-bold text-gold mb-3">예약 운영시간 설정</h3>
                <div class="grid grid-cols-3 gap-2">
                    <label class="text-[11px] text-gray-300">시작 시간
                        <input id="openHour" type="number" min="0" max="23" value="9" class="mt-1 w-full bg-[#163023] border border-gold/20 rounded-lg p-2 text-sm text-white">
                    </label>
                    <label class="text-[11px] text-gray-300">일반 마감
                        <input id="closeHour" type="number" min="0" max="23" value="20" class="mt-1 w-full bg-[#163023] border border-gold/20 rounded-lg p-2 text-sm text-white">
                    </label>
                    <label class="text-[11px] text-gray-300">수요일 마감
                        <input id="wednesdayCloseHour" type="number" min="0" max="23" value="17" class="mt-1 w-full bg-[#163023] border border-gold/20 rounded-lg p-2 text-sm text-white">
                    </label>
                </div>
                <button onclick="saveBookingSettings()" class="w-full mt-3 bg-gold text-[#163023] font-bold text-xs py-3 rounded-xl">운영시간 저장</button>
                <div class="border-t border-gold/15 mt-4 pt-4">
                    <h4 class="text-xs font-bold text-gray-200 mb-2">임시 휴무일 지정</h4>
                    <div class="flex gap-2">
                        <input id="closedDateInput" type="date" class="min-w-0 flex-1 bg-[#163023] border border-gold/20 rounded-lg p-2 text-sm text-white">
                        <button onclick="addClosedDate()" class="bg-[#163023] border border-gold/30 text-gold text-xs px-4 rounded-lg">휴무 추가</button>
                    </div>
                    <div id="closedDateList" class="space-y-2 mt-3"></div>
                </div>
                <p class="text-[10px] text-gray-400 mt-3 leading-relaxed">기본값: 오전 9시 시작 / 일반 마감 오후 8시 / 수요일 마감 오후 5시. 공휴일은 기존 달력 설정대로 계속 휴무 처리됩니다.</p>
            </section>
            <div id="bookingList" class="space-y-3"></div>
        </div>

    </div>

    <script>
        function checkLogin() {
            const pw = document.getElementById('adminPw').value;
            if (pw === "1234") {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                loadBookings();
                loadBookingSettings();
            } else {
                alert("비밀번호가 올바르지 않습니다.");
            }
        }

        function logout() {
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('adminPw').value = '';
        }

        function loadBookingSettings() {
            database.ref('settings/booking').on('value', (snapshot) => {
                const saved = snapshot.val() || {};
                document.getElementById('openHour').value = Number.isInteger(Number(saved.openHour)) ? Number(saved.openHour) : 9;
                document.getElementById('closeHour').value = Number.isInteger(Number(saved.closeHour)) ? Number(saved.closeHour) : 20;
                document.getElementById('wednesdayCloseHour').value = Number.isInteger(Number(saved.wednesdayCloseHour)) ? Number(saved.wednesdayCloseHour) : 17;
                renderClosedDates(Array.isArray(saved.closedDates) ? saved.closedDates : []);
            });
        }

        function saveBookingSettings() {
            const openHour = Number(document.getElementById('openHour').value);
            const closeHour = Number(document.getElementById('closeHour').value);
            const wednesdayCloseHour = Number(document.getElementById('wednesdayCloseHour').value);

            const validHour = value => Number.isInteger(value) && value >= 0 && value <= 23;
            if (!validHour(openHour) || !validHour(closeHour) || !validHour(wednesdayCloseHour) ||
                closeHour < openHour || wednesdayCloseHour < openHour) {
                alert('시간은 0~23 사이의 정수로 입력하고, 마감 시간은 시작 시간보다 늦어야 합니다.');
                return;
            }

            const current = window.currentClosedDates || [];
            database.ref('settings/booking').update({
                openHour,
                closeHour,
                wednesdayCloseHour,
                closedDates: current
            }).then(() => alert('예약 운영시간이 저장되었습니다.'))
              .catch(() => alert('저장에 실패했습니다. 잠시 후 다시 시도해 주세요.'));
        }

        function renderClosedDates(dates) {
            window.currentClosedDates = dates;
            const list = document.getElementById('closedDateList');
            list.innerHTML = '';
            if (!dates.length) {
                list.innerHTML = '<p class="text-[11px] text-gray-400">추가된 임시 휴무일이 없습니다.</p>';
                return;
            }
            dates.slice().sort().forEach(date => {
                const row = document.createElement('div');
                row.className = 'flex items-center justify-between bg-[#163023] border border-gold/10 rounded-lg px-3 py-2';
                const label = document.createElement('span');
                label.className = 'text-xs text-gray-200';
                label.textContent = date;
                const remove = document.createElement('button');
                remove.className = 'text-[11px] text-red-300 px-2 py-1';
                remove.textContent = '삭제';
                remove.onclick = () => updateClosedDates(dates.filter(item => item !== date));
                row.append(label, remove);
                list.appendChild(row);
            });
        }

        function updateClosedDates(dates) {
            window.currentClosedDates = dates;
            database.ref('settings/booking').update({ closedDates: dates })
                .catch(() => alert('휴무일 저장에 실패했습니다.'));
        }

        function addClosedDate() {
            const input = document.getElementById('closedDateInput');
            const date = input.value;
            if (!date) {
                alert('휴무일 날짜를 선택해 주세요.');
                return;
            }
            const dates = window.currentClosedDates || [];
            if (dates.includes(date)) {
                alert('이미 등록된 휴무일입니다.');
                return;
            }
            updateClosedDates([...dates, date]);
            input.value = '';
        }

        function loadBookings() {
            database.ref('bookings').on('value', (snapshot) => {
                const listEl = document.getElementById('bookingList');
                listEl.innerHTML = '';

                const data = snapshot.val();
                if (!data) {
                    listEl.innerHTML = '<p class="text-center text-xs text-gray-400 py-10">접수된 예약 내역이 없습니다.</p>';
                    return;
                }

                const keys = Object.keys(data).reverse(); // 최신순 정렬
                keys.forEach(key => {
                    const item = data[key];
                    
                    // 과거 코드로 저장된 데이터 호환 처리
                    if (!item.status) item.status = 'confirmed';

                    const isPending = item.status === 'pending';
                    const isConfirmed = item.status === 'confirmed';
                    const isCancelled = item.status === 'cancelled';

                    const card = document.createElement('div');
                    card.className = `bg-boxDark border border-gold/20 rounded-2xl p-4 shadow-md ${isCancelled ? 'opacity-60 bg-[#122318]' : ''}`;

                    // 상태 뱃지 디자인
                    let statusBadge = '';
                    if (isPending) {
                        statusBadge = '<span class="text-[11px] text-yellow-400 font-bold bg-yellow-950/40 px-2 py-0.5 rounded border border-yellow-500/30">승인 대기</span>';
                    } else if (isConfirmed) {
                        statusBadge = '<span class="text-[11px] text-green-400 font-bold bg-green-950/40 px-2 py-0.5 rounded border border-green-500/30">예약 확정</span>';
                    } else {
                        statusBadge = '<span class="text-[11px] text-gray-400 font-bold bg-gray-800/40 px-2 py-0.5 rounded border border-gray-600/30">거절/취소됨</span>';
                    }

                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xs font-bold text-gold bg-[#163023] px-2.5 py-1 rounded-lg border border-gold/20">
                                ${item.year}.${item.month}.${item.day} (${item.time})
                            </span>
                            ${statusBadge}
                        </div>
                        <div class="space-y-1 mb-3 text-xs text-gray-200">
                            <p><strong class="text-gray-400">성함:</strong> ${item.name}</p>
                            <p><strong class="text-gray-400">연락처:</strong> <a href="tel:${item.phone}" class="text-gold underline">${item.phone}</a></p>
                            <p><strong class="text-gray-400">프로그램:</strong> ${item.program}</p>
                        </div>
                        
                        ${isPending ? `
                            <div class="grid grid-cols-2 gap-2 mt-3">
                                <button onclick="approveBooking('${key}')" class="bg-gold text-[#163023] text-xs font-bold py-2.5 rounded-xl active:scale-95 transition-transform">
                                    예약 승인
                                </button>
                                <button onclick="rejectBooking('${key}')" class="bg-red-950/60 border border-red-500/30 text-red-300 text-xs font-semibold py-2.5 rounded-xl active:scale-95 transition-transform">
                                    예약 거절
                                </button>
                            </div>
                        ` : ''}

                        ${isConfirmed ? `
                            <button onclick="rejectBooking('${key}')" class="w-full mt-3 bg-red-950/60 border border-red-500/30 text-red-300 text-xs font-semibold py-2 rounded-xl active:scale-95 transition-transform">
                                승인된 예약 취소하기
                            </button>
                        ` : ''}

                        ${isCancelled ? `
                            <button onclick="deleteBooking('${key}')" class="w-full mt-3 bg-gray-800/60 border border-gray-500/30 text-gray-400 text-xs font-semibold py-2 rounded-xl hover:bg-gray-700 active:scale-95 transition-transform">
                                <i class="fa-solid fa-trash-can mr-1"></i> 이 기록 완전 삭제하기
                            </button>
                        ` : ''}
                    `;

                    listEl.appendChild(card);
                });
            });
        }

        // 예약 승인
        function approveBooking(key) {
            database.ref('bookings/' + key).update({
                status: 'confirmed'
            });
        }

        // 예약 거절/취소
        function rejectBooking(key) {
            if (confirm("이 예약을 취소/거절하시겠습니까? (취소 시 달력에서 타 손님이 선택 가능해집니다)")) {
                database.ref('bookings/' + key).update({
                    status: 'cancelled'
                });
            }
        }

        // 예약 기록 영구 삭제 (새로 추가된 기능!)
        function deleteBooking(key) {
            if (confirm("이 예약 기록을 목록에서 완전히 지우시겠습니까? (복구 불가능)")) {
                database.ref('bookings/' + key).remove();
            }
        }
    </script>
</body>
</html>
