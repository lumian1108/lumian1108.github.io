<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>루미안 에스테틱 | 관리자 시스템</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgDark: '#163023',
                        boxDark: '#1F3C2C',
                        gold: '#d4af37',
                    }
                }
            }
        }

        const firebaseConfig = {
            apiKey: "AIzaSyAL5Q-dAKzI8961lcUjMXM9UV1_IFywY2w",
            authDomain: "lumian-booking.firebaseapp.com",
            databaseURL: "https://lumian-booking-default-rtdb.firebaseio.com",
            projectId: "lumian-booking",
            storageBucket: "lumian-booking.firebasestorage.app",
            messagingSenderId: "326384208087",
            appId: "1:326384208087:web:24d696f92773c98251c892",
            measurementId: "G-ZKP4VRX43"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
    </script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { 
            font-family: 'Pretendard', sans-serif; 
            background-color: #163023; 
            color: white; 
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="antialiased flex justify-center min-h-screen">

    <div class="w-full max-w-md relative flex flex-col pt-12 pb-24 px-6">
        
        <div id="loginSection" class="my-auto">
            <div class="text-center mb-8">
                <h1 class="text-gold text-3xl font-serif font-bold mb-2">LUMIAN ADMIN</h1>
                <p class="text-xs text-gray-300">루미안 에스테틱 관리자 대시보드</p>
            </div>

            <div class="bg-boxDark border border-gold/30 rounded-2xl p-6 shadow-xl space-y-4">
                <div>
                    <label class="block text-xs text-gray-300 mb-1">비밀번호</label>
                    <input type="password" id="adminPw" placeholder="비밀번호를 입력하세요 (기본: 1234)" class="w-full bg-[#163023] border border-gold/20 rounded-xl p-3.5 text-sm text-white focus:outline-none focus:border-gold">
                </div>
                <button onclick="checkLogin()" class="w-full bg-gold text-[#163023] font-bold rounded-xl py-3.5 shadow-lg active:scale-95 transition-transform">
                    관리자 로그인
                </button>
            </div>
        </div>

        <div id="dashboardSection" class="hidden">
            <div class="flex justify-between items-center mb-6 border-b border-gold/20 pb-4">
                <div>
                    <h2 class="text-xl font-bold text-gold">예약 현황 관리</h2>
                    <p class="text-xs text-gray-300 mt-1">실시간 승인/거절 대시보드</p>
                </div>
                <button onclick="logout()" class="text-xs text-gray-400 bg-boxDark border border-gold/20 px-3 py-1.5 rounded-lg">로그아웃</button>
            </div>

            <div id="bookingList" class="space-y-3"></div>
        </div>

    </div>

    <script>
        function checkLogin() {
            const pw = document.getElementById('adminPw').value;
            if (pw === "1234") {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                loadBookings();
            } else {
                alert("비밀번호가 올바르지 않습니다.");
            }
        }

        function logout() {
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('adminPw').value = '';
        }

        function loadBookings() {
            database.ref('bookings').on('value', (snapshot) => {
                const listEl = document.getElementById('bookingList');
                listEl.innerHTML = '';

                const data = snapshot.val();
                if (!data) {
                    listEl.innerHTML = '<p class="text-center text-xs text-gray-400 py-10">접수된 예약 내역이 없습니다.</p>';
                    return;
                }

                const keys = Object.keys(data).reverse();
                keys.forEach(key => {
                    const item = data[key];
                    const isPending = item.status === 'pending';
                    const isConfirmed = item.status === 'confirmed';
                    const isCancelled = item.status === 'cancelled';

                    const card = document.createElement('div');
                    card.className = `bg-boxDark border border-gold/20 rounded-2xl p-4 shadow-md ${isCancelled ? 'opacity-50' : ''}`;

                    let statusBadge = '';
                    if (isPending) statusBadge = '<span class="text-[11px] text-yellow-400 font-bold bg-yellow-950/40 px-2 py-0.5 rounded border border-yellow-500/30">승인 대기</span>';
                    else if (isConfirmed) statusBadge = '<span class="text-[11px] text-green-400 font-bold bg-green-950/40 px-2 py-0.5 rounded border border-green-500/30">예약 확정</span>';
                    else statusBadge = '<span class="text-[11px] text-red-400 font-bold bg-red-950/40 px-2 py-0.5 rounded border border-red-500/30">거절/취소</span>';

                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xs font-bold text-gold bg-[#163023] px-2.5 py-1 rounded-lg border border-gold/20">
                                ${item.year}.${item.month}.${item.day} (${item.time})
                            </span>
                            ${statusBadge}
                        </div>
                        <div class="space-y-1 mb-3 text-xs text-gray-200">
                            <p><strong class="text-gray-400">성함:</strong> ${item.name}</p>
                            <p><strong class="text-gray-400">연락처:</strong> <a href="tel:${item.phone}" class="text-gold underline">${item.phone}</a></p>
                            <p><strong class="text-gray-400">프로그램:</strong> ${item.program}</p>
                        </div>
                        
                        ${isPending ? `
                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="approveBooking('${key}')" class="bg-gold text-[#163023] text-xs font-bold py-2 rounded-xl active:scale-95 transition-transform">
                                    예약 승인
                                </button>
                                <button onclick="rejectBooking('${key}')" class="bg-red-950/60 border border-red-500/30 text-red-300 text-xs font-semibold py-2 rounded-xl active:scale-95 transition-transform">
                                    예약 거절
                                </button>
                            </div>
                        ` : ''}

                        ${isConfirmed ? `
                            <button onclick="rejectBooking('${key}')" class="w-full bg-red-950/60 border border-red-500/30 text-red-300 text-xs font-semibold py-2 rounded-xl active:scale-95 transition-transform">
                                확정 취소하기
                            </button>
                        ` : ''}
                    `;

                    listEl.appendChild(card);
                });
            });
        }

        function approveBooking(key) {
            database.ref('bookings/' + key).update({
                status: 'confirmed'
            });
        }

        function rejectBooking(key) {
            if (confirm("이 예약을 취소/거절하시겠습니까? (취소 시 달력에서 타 손님이 선택 가능해집니다)")) {
                database.ref('bookings/' + key).update({
                    status: 'cancelled'
                });
            }
        }
    </script>
</body>
</html>
